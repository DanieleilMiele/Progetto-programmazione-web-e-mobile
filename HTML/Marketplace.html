    <meta charset="UTF-8">

        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../CSS/Info_supereroe.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand ms-2" href="#">AFSE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll"
                aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarScroll">
                <ul class="navbar-nav me-auto my-2 my-lg-0 navbar-nav-scroll" style="--bs-scroll-height: 100px;">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="Album_main.html">Album</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Account.html">Profilo</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">Mercato</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="Negozio.html">Acquista crediti/pacchetti</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="Marketplace.html">Scambia figurine</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled">Link</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <div class="container mt-4">
        <div class="row align-items-stretch">
            <!-- Sezione scambi disponibili -->
            <div class="col-md-6">
                <div class="card h-100 shadow">
                    <div class="card-header bg-dark text-white">
                        Scambi Disponibili
                    </div>
                    <div class="card-body" style="overflow-y: auto;">
                        <ul id="lista-scambi" class="list-group">
                            <!-- Template per gli scambi -->
                            <li class="list-group-item d-none" id="template-scambio">
                                <div class="d-flex flex-column">
                                    <p class="mb-1">
                                        <strong>Utente:</strong> <span class="nome-utente"></span><br>
                                        <strong>Carta Proposta:</strong> <span class="carta-proposta"></span><br>
                                        <!-- Seconda carta proposta, nascosta di default -->
                                        <strong class="seconda-carta-label d-none">Seconda Carta Proposta:</strong> <span class="seconda-carta-proposta d-none"></span><br>
                                        <strong>Carta Richiesta:</strong> <span class="carta-richiesta"></span>
                                    </p>
                                    <button class="btn btn-sm btn-primary align-self-end" onclick="accettaProposta(this)">Accetta</button>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Sezione proposta scambio -->
            <div class="col-md-6">
                <div class="card h-100 shadow">
                    <div class="card-header bg-dark text-white">
                        Proponi uno Scambio
                    </div>
                    <div class="card-body">
                        <form id="form-scambio">
                            <div class="mb-3">
                                <label for="carta-proposta" class="form-label">Carta Proposta</label>
                                <!-- Collegamento tra input e datalist tramite attributo 'list' per una lista reattiva all'input dell'utente -->
                                <input class="form-select" id="carta-proposta" placeholder="Seleziona la carta che proponi" list="tendina-carte" required>
                                <datalist id="tendina-carte">
                                
                                </datalist>
                            </div>
                            <!-- Campo per la seconda carta proposta, nascosto inizialmente -->
                            <div class="mb-3 d-none" id="seconda-carta-proposta-group">
                                <!-- Collegamento tra input e datalist tramite attributo 'list' per una lista reattiva all'input dell'utente -->
                                <label for="seconda-carta-proposta" class="form-label">Seconda Carta Proposta</label>
                                <input class="form-select" id="seconda-carta-proposta" placeholder="Seleziona la seconda carta che proponi" list="tendina2-carte" required>
                                <datalist id="tendina2-carte">

                                </datalist>
                            </div>
                            <div class="mb-3">
                                <label for="carta-richiesta" class="form-label">Carta Richiesta</label>
                                <!-- Collegamento tra input e datalist tramite attributo 'list' per una lista reattiva all'input dell'utente -->
                                <input class="form-select" id="carta-richiesta" placeholder="Seleziona la carta che desideri in cambio" list="tendina-carte-richiesta" required>
                                <datalist id="tendina-carte-richiesta">

                                </datalist>
                            </div>
                            <button type="button" class="btn btn-primary" id="btn-proponi-scambio">Proponi Scambio</button>
                            <button type="button" class="btn btn-success" id="btn-scambio-doppio">Proponi Scambio Doppio</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="../JS/Comune.js"></script>
    <script src="../JS/Marketplace.js"></script>

    <script>
        /* checkLog(); */
    </script>
</body>

</html>
